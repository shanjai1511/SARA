---
domain: styleunion.in
fields:
  crawl_timestamp:
    desc_of_xpath: "Crawl timestamp"
    standard_nodeset_range: first
  uniq_id:
    desc_of_xpath: "Unique id"
    standard_nodeset_range: first
  page_url:
    desc_of_xpath: "Page URL"
    standard_nodeset_range: first
  product_name:
    desc_of_xpath: "Product title from h1.product__title"
    standard_nodeset_range: first
  list_price:
    desc_of_xpath: "MRP from product__info span.regular-price"
    standard_nodeset_range: first
  selling_price:
    desc_of_xpath: "Selling price (sale-price if discounted, else list_price)"
    standard_nodeset_range: first
  discount_percentage:
    desc_of_xpath: "Discount % computed from list vs selling price"
    standard_nodeset_range: first
  color:
    desc_of_xpath: "First color option from main-product-Color input"
    standard_nodeset_range: first
  size:
    desc_of_xpath: "Size from variantSku span"
    standard_nodeset_range: first
  description:
    desc_of_xpath: "Product description from product__description div"
    standard_nodeset_range: first
  sku:
    desc_of_xpath: "SKU from sku_id input"
    standard_nodeset_range: first
