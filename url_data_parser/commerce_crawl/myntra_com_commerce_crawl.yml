---
domain: myntra.com
fields:
  crawl_timestamp:
    desc_of_xpath: "Crawl timestamp"
    standard_nodeset_range: first
  uniq_id:
    desc_of_xpath: "Unique id"
    standard_nodeset_range: first
  page_url:
    desc_of_xpath: "Page URL"
    standard_nodeset_range: first
  product_name:
    desc_of_xpath: "Product name from window.__myx pdpData"
    standard_nodeset_range: first
  brand:
    desc_of_xpath: "Brand name from pdpData.brand.name"
    standard_nodeset_range: first
  selling_price:
    desc_of_xpath: "Selling price from pdpData.price.discounted"
    standard_nodeset_range: first
  list_price:
    desc_of_xpath: "MRP from pdpData.price.mrp"
    standard_nodeset_range: first
  discount_percentage:
    desc_of_xpath: "Discount percentage computed from mrp and selling price"
    standard_nodeset_range: first
  rating:
    desc_of_xpath: "Average rating from pdpData.ratings.averageRating"
    standard_nodeset_range: first
  num_reviews:
    desc_of_xpath: "Review count from pdpData.ratings.totalCount"
    standard_nodeset_range: first
  sku:
    desc_of_xpath: "Product ID from pdpData.id"
    standard_nodeset_range: first
  color:
    desc_of_xpath: "Base colour from pdpData.baseColour"
    standard_nodeset_range: first
