###############################################################################
# Prometheus scrape configuration for SARA
###############################################################################

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "production"
    service: "sara"

# Alerting rules (optional — extend with your alert manager config)
# rule_files:
#   - "alerts/*.yml"

scrape_configs:

  # ── SARA FastAPI (metrics exported by prometheus_client) ─────────────────
  - job_name: "sara-api"
    static_configs:
      - targets: ["sara-api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # ── SARA Async Retriever Workers ──────────────────────────────────────────
  - job_name: "sara-retriever"
    static_configs:
      - targets: ["sara-retriever:8001"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # ── SARA Discovery Workers ────────────────────────────────────────────────
  - job_name: "sara-discovery"
    static_configs:
      - targets: ["sara-discovery:8002"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ── RabbitMQ exporter ─────────────────────────────────────────────────────
  # Requires: docker run -d -p 9419:9419 kbudde/rabbitmq-exporter
  # - job_name: "rabbitmq"
  #   static_configs:
  #     - targets: ["rabbitmq-exporter:9419"]

  # ── Redis exporter ────────────────────────────────────────────────────────
  # Requires: docker run -d -p 9121:9121 oliver006/redis_exporter
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # ── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
